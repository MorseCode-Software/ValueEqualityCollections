version: '{build}'

image: Visual Studio 2026

shallow_clone: false
clone_depth: 0

configuration: Release

environment:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  SOLUTION: MorseCode.Collections.ValueEquality.sln
  NUGET_API_KEY:
    secure: wJnjNcFPeKed+NXnE+IjPM5sAlJxY1Q3noeEdWi1E070zGc/E+pm6Dx1f8s7gNHB

before_build:
  - dotnet --info
  - dotnet restore %SOLUTION%

build_script:
  - dotnet build %SOLUTION% -c %CONFIGURATION%

test_script:
  - dotnet test --solution %SOLUTION% -c %CONFIGURATION% --no-build

after_test:
  - dotnet pack %SOLUTION% -c %CONFIGURATION% -o artifacts
  - ps: Get-ChildItem artifacts\*.nupkg | Sort-Object Name | ForEach-Object { Write-Host $_.Name }

artifacts:
  - path: artifacts\*.nupkg
    name: packages

deploy_script:
  - ps: |
      if ($env:APPVEYOR_REPO_TAG -ne "true") {
          Write-Host "Not a tag build - skipping NuGet push.  APPVEYOR_REPO_TAG = $($env:APPVEYOR_REPO_TAG)"
          return
      }

      $tag = $env:APPVEYOR_REPO_TAG_NAME
      if (-not $tag) {
          throw "APPVEYOR_REPO_TAG is true but APPVEYOR_REPO_TAG_NAME is empty, so there is no way to tell which package this build releases."
      }

      if (-not $env:NUGET_API_KEY) {
          throw "NUGET_API_KEY is not set. Add it as a secure variable in AppVeyor."
      }

      $packageIdByPrefix = @{}
      Get-ChildItem -Path src -Recurse -Include *.csproj, *.fsproj |
          Where-Object { $_.FullName -notmatch '\\(bin|obj)\\' } |
          ForEach-Object {
              $project = [xml](Get-Content -Path $_.FullName -Raw)
              $prefix = $project.SelectSingleNode('//MinVerTagPrefix')
              $id = $project.SelectSingleNode('//PackageId')
              if ($prefix -and $id) { $packageIdByPrefix[$prefix.InnerText] = $id.InnerText }
          }
      if ($packageIdByPrefix.Count -eq 0) {
          throw "Found no project under src declaring both MinVerTagPrefix and PackageId."
      }

      $prefixes = @(
          $packageIdByPrefix.Keys |
              Where-Object {
                  $tag.StartsWith($_, [StringComparison]::Ordinal) -and $tag.Substring($_.Length) -match '^\d'
              }
      )

      if ($prefixes.Count -eq 0) {
          Write-Host "Tag '$tag' does not name a package in this repository - skipping NuGet push."
          Write-Host "Known prefixes: $(($packageIdByPrefix.Keys | Sort-Object) -join ', ')"
          return
      }

      if ($prefixes.Count -gt 1) {
          throw "Tag '$tag' matches more than one package prefix: $(($prefixes | Sort-Object) -join ', '). Rename one of them so that neither extends the other."
      }

      $packageId = $packageIdByPrefix[$prefixes[0]]
      Write-Host "Tag '$tag' releases $packageId."

      $package = @(
          Get-ChildItem artifacts\*.nupkg |
              Where-Object { $_.Name -notlike "*.symbols.nupkg" } |
              Where-Object {
                  $_.Name.StartsWith("$packageId.", [StringComparison]::OrdinalIgnoreCase) -and
                  $_.Name.Substring($packageId.Length + 1) -match '^\d'
              }
      )

      if ($package.Count -ne 1) {
          throw "Expected exactly one $packageId package in artifacts, found $($package.Count)."
      }

      Write-Host "Pushing $($package[0].Name)"
      dotnet nuget push $package[0].FullName `
          --skip-duplicate `
          --api-key $env:NUGET_API_KEY `
          --source https://api.nuget.org/v3/index.json
      if ($LASTEXITCODE -ne 0) { throw "Failed to push $($package[0].Name)" }
